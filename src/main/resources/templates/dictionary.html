<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8">
    <title th:text="${title}">Справочник</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="d-flex flex-column vh-100">

<!-- Навигационное меню -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            💧 Водоканал - <span th:text="${title}"></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/clients/getBishClients">Клиенты</a></li>
                <li class="nav-item"><a class="nav-link" href="/dictionary/stations">Станции</a></li>
                <li class="nav-item"><a class="nav-link" href="/dictionary/streets">Улицы</a></li>
                <li class="nav-item"><a class="nav-link" href="/dictionary/houses">Дома</a></li>
                <li class="nav-item"><a class="nav-link" href="/dictionary/tariffs">Тарифы</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3">👤 Пользователь</span>
                <a class="btn btn-outline-light btn-sm me-2" href="/profile">Профиль</a>
                <a class="btn btn-danger btn-sm" href="/logout">Выход</a>
            </div>
        </div>
    </div>
</nav>

<!-- Основное рабочее окно -->
<div class="d-flex flex-grow-1">
    <div class="sidebar d-flex flex-column bg-white border-end shadow-sm" style="width: 230px; min-height: 100vh;">
        <div class="p-3 border-bottom">
            <h5 class="fw-bold text-primary mb-0"><i class="fa-solid fa-droplet"></i> Водоканал</h5>
        </div>
        <ul class="nav flex-column mt-2">
            <li class="nav-item mt-2 border-top pt-2 text-muted small px-3">Другое</li>
            <li class="nav-item">
                <a class="nav-link d-flex align-items-center py-2 px-3 text-secondary" href="/clients/getBishClients">
                    <i class="fa-solid fa-users me-2 text-primary"></i> Клиенты
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link d-flex align-items-center py-2 px-3 text-secondary" href="/pay">
                    <i class="fa-solid fa-credit-card me-2 text-success"></i> Оплаты
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link d-flex align-items-center py-2 px-3 text-secondary" href="/saldo">
                    <i class="fa-solid fa-scale-balanced me-2 text-success"></i> Сальдо
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link d-flex align-items-center py-2 px-3 text-secondary" href="/indications">
                    <i class="fa-solid fa-gauge me-2 text-danger"></i> Показания
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link d-flex align-items-center py-2 px-3 text-secondary" href="/print/select">
                    <i class="fa-solid fa-file-lines me-2 text-primary"></i> Отчёты
                </a>
            </li>
        </ul>
    </div>

    <div class="content d-flex flex-column p-2 flex-grow-1">
        <div class="bg-white p-3 rounded shadow-sm d-flex flex-column" style="height: 80vh;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0" th:text="${title}">Справочник</h5>
                <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#addEditModal" id="openAddModalBtn">
                    + Добавить
                </button>
            </div>
            <div class="table-responsive flex-grow-1" style="overflow-y: auto;">
                <table id="dictTable" class="table table-sm table-hover align-middle">
                    <thead class="table-light" style="position: sticky; top: 0; z-index: 2; background: #f8f9fa;">
                        <tr id="tableHeader">
                            <!-- Headers generated by JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows generated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно Добавить/Редактировать -->
<div class="modal fade" id="addEditModal" tabindex="-1" aria-labelledby="addEditModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="addEditModalLabel">Добавить / Редактировать</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <form id="dictForm" class="p-3">
                <div class="modal-body">
                    <div class="row g-3" id="formFields">
                        <!-- Fields generated by JS -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/jquery.min.js"></script>
<script src="/js/dictionary.js"></script>
</body>
</html>
